<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>How Chatbots Work</title>
<!-- reveal.js 6.0.2, vendored in lib/reveal (no build step, works offline) -->
<link rel="stylesheet" href="lib/reveal/reset.css">
<link rel="stylesheet" href="lib/reveal/reveal.css">
<!-- the demos' colors and fonts, then the slides' own typography -->
<link rel="stylesheet" href="common/stage.css">
<link rel="stylesheet" href="talk.css">
</head>
<body>
<!--
  HOW THIS WORKS
  Serve the repository (python -m http.server) and open http://localhost:8000/.

  Each <section> is one slide: a 1600 x 900 canvas, scaled as a whole to fit the screen.
    * Ordinary content (headings, paragraphs, lists) flows from the top-left inside a margin.
    * For exact placement, give an element class="at" and position it in slide pixels:
        <div class="at" style="left: 900px; top: 300px; width: 600px">...</div>
    * class="fragment" makes an element appear on the next key press (like \pause).
    * <aside class="notes">...</aside> holds speaker notes: press S for the presenter window.
    * A demo slide is a section with data-background-iframe="path/to/demo.html" and
      data-background-interactive: the demo fills the slide and responds to the mouse.

  Keys: → / PageDown next, ← / PageUp previous (also while a demo has the keyboard),
        Esc or O overview, S speaker notes, F full screen, B black screen,
        hold R to see the 1600 x 900 boundary and how far the window is from 16:9 (? lists Reveal's keys).
  The URL ends in #/slide-id (or #/number), so reloading returns to the same slide.
-->
<div class="reveal">
<div class="slides">

<section>
  <h1 class="at" style="left: 90px; top: 300px; width: 1400px">How Chatbots Work</h1>
  <p class="at grey" style="left: 92px; top: 430px; font-size: 40px">Understanding AI through Interactive Demos</p>
  <p class="at" style="left: 92px; top: 600px">Jim Pivarski</p>
  <p class="at grey" style="left: 92px; top: 655px; font-size: 28px">University of Chicago, Data Science Institute</p>
</section>

<!-- 1. data as points in space -->
<section data-background-iframe="demo0-space/1-ocean-data.html" data-background-interactive></section>
<!-- 2. a model: a smooth function from the data's space to the prediction -->
<section data-background-iframe="demo0-space/2-ocean-model.html" data-background-interactive></section>
<!-- 3. transformations: smooth functions from space to space -->
<section data-background-iframe="demo0-space/3-projections.html" data-background-interactive></section>
<!-- 4. a neural network: a chain of transformations, then a model -->
<section data-background-iframe="demo3-generalization/4-snowflake.html" data-background-interactive></section>
<section data-background-iframe="demo3-generalization/2-circle.html" data-background-interactive></section>
<section data-background-iframe="demo3-generalization/3-spirals.html" data-background-interactive></section>
<!-- 5. meanings of words as points in space -->
<section data-background-iframe="demo4-attention/1-embedding.html" data-background-interactive></section>
<!-- 6. relationships between words in a sequence: attention -->
<section data-background-iframe="demo4-attention/2-translation.html" data-background-interactive></section>
<!-- 7. higher-order patterns: syntax models generic aspects of the world -->
<section data-background-iframe="demo4-attention/3-verb-classes.html" data-background-interactive></section>
<!-- 8. a base LLM: knowledge and few-shot problem solving -->
<section data-background-iframe="demo5-few-shot/1-complete.html" data-background-interactive></section>
<!-- 9. RLHF (no demo) -->
<!-- 10. chatbots and agents: transcripts passed between LLMs, users, and tools -->
<section>
  <img class="at" style="left: 0; top: 0; width: 1600px; height: 900px; object-fit: contain;" src="img/basic-chatbot.png">
</section>
<section>
  <img class="at" style="left: 0; top: 0; width: 1600px; height: 900px; object-fit: contain;" src="img/tool-web-search.png">
</section>
<section>
  <img class="at" style="left: 0; top: 0; width: 1600px; height: 900px; object-fit: contain;" src="img/tool-reasoning.png">
</section>
<section>
  <img class="at" style="left: 0; top: 0; width: 1600px; height: 900px; object-fit: contain;" src="img/tool-agent.png">
</section>

</div>
</div>

<script src="lib/reveal/reveal.js"></script>
<script src="lib/reveal/plugin/notes.js"></script>
<!-- one copy of TensorFlow.js, shared by the demos that use it (see common/tf-host.js) -->
<script src="lib/tf.min.js"></script>
<script src="common/tf-host.js"></script>
<script>
Reveal.initialize({
  // a fixed 1600 x 900 canvas, like the demos, scaled to fit the window
  width: 1600,
  height: 900,
  margin: 0,
  minScale: 0.05,
  maxScale: 10,
  center: false,          // content starts at the top, where you put it (not vertically centered)
  hash: true,             // the URL tracks the slide, so a reload returns to it
  transition: "none",
  backgroundTransition: "none",
  controls: false,        // no on-screen arrows (they would sit on top of the demos)
  progress: true,         // thin progress bar along the bottom
  preloadIframes: false,  // a demo starts only when its slide is shown, and stops when you leave
  plugins: [RevealNotes],
});

// On a demo slide, hand the keyboard to the demo (so its keys, like the space bar, work at
// once); the demo passes ←, →, PageUp, and PageDown back here (see common/stage.js).
// On any other slide, take the keyboard back.
function focusSlide() {
  const slide = Reveal.getCurrentSlide();
  if (!slide.hasAttribute("data-background-iframe")) {
    if (document.activeElement && document.activeElement.tagName === "IFRAME") document.activeElement.blur();
    window.focus();
    return;
  }
  let tries = 0;
  const attempt = () => {
    const frame = Reveal.getSlideBackground(slide).querySelector("iframe");
    if (frame && frame.contentWindow) {
      const give = () => { frame.focus(); frame.contentWindow.focus(); };
      if (frame.contentDocument && frame.contentDocument.readyState === "complete") give();
      else frame.addEventListener("load", give, { once: true });
    } else if (tries++ < 50) setTimeout(attempt, 50);
  };
  attempt();
}
Reveal.on("ready", focusSlide);
// compile the TensorFlow.js demos' GPU programs now, unseen, so they don't freeze on first use
Reveal.on("ready", () => TFHost.warmUp([
  "demo0-space/2-ocean-model.html",
  "demo3-generalization/4-snowflake.html",
  "demo3-generalization/2-circle.html",
  "demo3-generalization/3-spirals.html",
]));
Reveal.on("slidechanged", focusSlide);

// While R is held down, outline the 1600 x 900 slide, shade the rest of the window, and say how
// far the window is from 16:9, to help size a window when not in full screen. A demo that has the
// keyboard passes R up as a {aspectFrame: true/false} message (see common/stage.js).
const aspectFrame = document.createElement("div");
aspectFrame.id = "aspect-frame";
aspectFrame.appendChild(document.createElement("div"));
document.body.appendChild(aspectFrame);
function showAspectFrame(on) {
  aspectFrame.classList.toggle("on", on);
  if (!on) return;
  const r = document.querySelector(".reveal .slides").getBoundingClientRect();
  const ww = window.innerWidth, wh = window.innerHeight;
  Object.assign(aspectFrame.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  const tall = Math.round(wh - ww * 9 / 16), wide = Math.round(ww - wh * 16 / 9);
  const fix = tall > 0 ? `${tall} px too tall` : wide > 0 ? `${wide} px too wide` : "16:9 exactly";
  aspectFrame.firstChild.textContent = `window ${ww} × ${wh}: ${fix}`;
}
const isTyping = (t) => t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
const isR = (e) => e.key.toLowerCase() === "r" && !e.ctrlKey && !e.metaKey && !e.altKey;
document.addEventListener("keydown", (e) => { if (isR(e) && !isTyping(e.target)) showAspectFrame(true); });
document.addEventListener("keyup", (e) => { if (e.key.toLowerCase() === "r") showAspectFrame(false); });
window.addEventListener("message", (e) => {
  if (e.data && typeof e.data === "object" && "aspectFrame" in e.data) showAspectFrame(!!e.data.aspectFrame);
});
window.addEventListener("blur", () => { if (!document.querySelector("iframe:focus")) showAspectFrame(false); });
window.addEventListener("resize", () => { if (aspectFrame.classList.contains("on")) showAspectFrame(true); });
</script>
</body>
</html>

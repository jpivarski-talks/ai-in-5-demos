<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Demo 5: few-shot completion</title>
<link rel="stylesheet" href="../common/stage.css">
<style>
  #text {
    position: absolute; box-sizing: border-box; padding: 22px 26px;
    font-family: var(--font); font-size: 28px; line-height: 1.45; color: var(--ink);
    border: 1.5px solid #bbb; border-radius: 10px; outline: none;
    white-space: pre-wrap; overflow-y: auto; user-select: text; -webkit-user-select: text;
  }
  #text:focus { border-color: var(--accent); }
  #text .completion { color: var(--accent); }
  /* "verbatim" preset: where the completion differs from the book, like a yellow highlighter */
  #text mark.diff { background: rgba(255, 226, 0, 0.6); color: inherit; border-radius: 2px; }
  #text .gap { display: inline-block; width: 5px; height: 1.05em; vertical-align: -0.18em; background: rgba(255, 226, 0, 0.9); border-radius: 2px; }
  #side { position: absolute; display: flex; flex-direction: column; gap: 10px; }
  #side .btn { text-align: left; }
  .settings label { display: block; font-size: 20px; color: #555; margin: 14px 0 4px; }
  .settings input { width: 100%; box-sizing: border-box; font-size: 20px; padding: 6px 10px; }
  #err { position: absolute; font-size: 20px; color: #c0392b; }
  #gear { position: absolute; font-size: 30px; color: #bbb; cursor: pointer; }
  #gear:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../common/stage.js"></script>
<script src="presets.js"></script>
<script src="alice.js"></script>
<script>
"use strict";
const DEFAULTS = { endpoint: "http://localhost:8080", model: "", key: "", temperature: "0.5", maxTokens: "" };   // blank max tokens: no limit
const cfg = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("demo5-settings") || "{}"));
// allow ?endpoint=... in the URL as well
const q = new URLSearchParams(location.search);
if (q.get("endpoint")) cfg.endpoint = q.get("endpoint");

const text = Stage.el("div", { id: "text", contenteditable: "plaintext-only", spellcheck: "false" });
Stage.place(text, { x: 20, y: 20, w: 1250, h: 860 });
const side = Stage.el("div", { id: "side" });
// the citation tops the right column; the presets start below however many lines it takes
const cite = Stage.cite([["T. B. Brown et al., <i>Language Models are Few-Shot Learners</i> (2020).", "https://doi.org/10.48550/arXiv.2005.14165"]],
  { x: 1300, y: 20, w: 280 }, { align: "left" });
const sideTop = 20 + cite.offsetHeight + 30;   // a little space below the citation
Stage.place(side, { x: 1300, y: sideTop, w: 280, h: 720 - sideTop });
const err = Stage.el("div", { id: "err" });
Stage.place(err, { x: 1300, y: 590, w: 280, h: 90 });
// temperature and max tokens sit out here (not in settings) so they can be changed quickly,
// e.g. temperature 0 for repeatable answers; max tokens blank means no limit
Stage.label("temperature", { x: 1300, y: 710, w: 150, h: 30 }, { fontSize: "22px" });
const temp = Stage.el("input", { id: "temp", class: "knob", type: "number", min: "0", max: "2", step: "0.1", value: cfg.temperature, title: "temperature" });
Stage.place(temp, { x: 1460, y: 700, w: 110, h: 44 });
temp.addEventListener("change", () => {
  cfg.temperature = temp.value.trim() || DEFAULTS.temperature;
  temp.value = cfg.temperature;
  localStorage.setItem("demo5-settings", JSON.stringify(cfg));
});
Stage.label("max tokens", { x: 1300, y: 766, w: 150, h: 30 }, { fontSize: "22px" });
const maxTok = Stage.el("input", { id: "maxtok", class: "knob", type: "number", min: "1", step: "1", value: cfg.maxTokens, title: "max tokens" });
Stage.place(maxTok, { x: 1460, y: 756, w: 110, h: 44 });
maxTok.addEventListener("change", () => {
  const v = Math.floor(+maxTok.value);
  cfg.maxTokens = maxTok.value.trim() && v > 0 ? String(v) : "";
  maxTok.value = cfg.maxTokens;
  localStorage.setItem("demo5-settings", JSON.stringify(cfg));
});
const go = Stage.button("complete", () => complete(), null, { cls: "primary" });
Stage.place(go, { x: 1300, y: 812, w: 210, h: 64 });
go.style.fontSize = "26px";
const gear = Stage.el("div", { id: "gear", html: "&#9881;", title: "settings" });
Stage.place(gear, { x: 1535, y: 822, w: 40, h: 40 });

let abort = null;

// a preset just fills in the text box (and "verbatim" also turns on the check against the book);
// the buttons are headed "Examples:", the size of the labels of the knobs below but bold, in the text color
const examples = Stage.el("div", { text: "Examples:" }, side);
Object.assign(examples.style, { fontSize: "22px", fontWeight: "bold", color: Stage.COLORS.ink });
for (const p of PRESETS) {
  Stage.button(p.label, () => { stop(); setText(p.prompt); setVerbatim(p.verbatim ? p.verbatim() : null); }, side);
}
function setText(s) { text.textContent = s; err.textContent = ""; placeCaret(); }
function placeCaret() {
  const r = document.createRange(); r.selectNodeContents(text); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  text.scrollTop = text.scrollHeight;
}

function stop() { if (abort) abort.abort(); }

// ---------------------------------------------------------------- checking a completion against the book
// While on, everything in the box is compared with the original text, character by character,
// and the completion's differences are highlighted: extra or changed characters in yellow, and a
// thin yellow bar where some of the original is missing. The comparison ignores what a reader
// wouldn't count as a difference: curly vs. straight quotes, -- vs. a dash, italics marks, and
// line breaks vs. spaces. Typing in the box or choosing another preset turns it off.
let verbatim = null;   // {orig: normalized original text} while checking
const CFG_VERBATIM = { minRun: 12 };   // agreements shorter than this, between differences, are coincidences
function setVerbatim(original) {
  verbatim = original ? { orig: normalize([original]).chars } : null;
}
// the comparable characters of some strings, and where each one came from: [string, offset]
function normalize(strings) {
  const chars = [], where = [];
  let prevSpace = true;
  strings.forEach((str, g) => {
    for (let o = 0; o < str.length; o++) {
      let c = str[o];
      if (c === "_" || c === "*") continue;
      if (/\s/.test(c)) { if (prevSpace) continue; c = " "; }
      else if ("‘’“”\"`".includes(c)) c = "'";
      else if (c === "-" && str[o + 1] === "-") { c = "—"; o++; }
      prevSpace = c === " ";
      chars.push(c); where.push([g, c === "—" && str[o] === "-" ? o - 1 : o]);
    }
  });
  return { chars, where };
}
// Line up all of a (the box) with the beginning of b (the book), with the fewest characters added
// or removed (Myers's diff, stopping as soon as a is used up). Returns, for each character of a,
// whether it is extra (not in the book), and before which characters something of the book is missing.
function prefixDiff(a, b, cap) {
  const N = a.length, M = b.length, MAX = Math.min(N + M, cap || 3000), off = MAX + 1;
  const V = new Int32Array(2 * MAX + 3).fill(-1), trace = [];
  V[off + 1] = 0;
  let endD = -1, endK = 0;
  outer: for (let d = 0; d <= MAX; d++) {
    trace.push(V.slice());
    for (let k = -d; k <= d; k += 2) {
      const down = k === -d || (k !== d && V[off + k - 1] < V[off + k + 1]);
      const src = down ? V[off + k + 1] : V[off + k - 1];
      if (src < 0) { V[off + k] = -1; continue; }
      let x = down ? src : src + 1, y = x - k;
      if (x > N || y > M) { V[off + k] = -1; continue; }
      while (x < N && y < M && a[x] === b[y]) { x++; y++; }
      V[off + k] = x;
      if (x >= N) { endD = d; endK = k; break outer; }
    }
  }
  const extra = new Uint8Array(N), gap = new Uint8Array(N + 1);
  if (endD < 0) { extra.fill(1); return { extra, gap }; }   // nothing like the book at all
  let x = N, y = N - endK;
  for (let d = endD; d > 0; d--) {
    const T = trace[d], k = x - y;
    const down = k === -d || (k !== d && T[off + k - 1] < T[off + k + 1]);
    const pk = down ? k + 1 : k - 1, px = T[off + pk], py = px - pk;
    while (x > px && y > py) { x--; y--; }
    if (down) gap[x] = 1; else extra[x - 1] = 1;
    x = px; y = py;
  }
  return { extra, gap };
}
let checkPending = false;
function scheduleCheck() {
  if (checkPending) return;
  checkPending = true;
  requestAnimationFrame(() => { checkPending = false; check(); });
}
function check() {
  if (!verbatim) return;
  const nodes = [...text.childNodes];
  const strs = nodes.map((n) => n.nodeType === 1 && n.classList.contains("completion") ? (n._text || "") : n.textContent);
  const { chars, where } = normalize(strs);
  const { extra, gap } = prefixDiff(chars, verbatim.orig);
  // Where the model has wandered off into text of its own, the diff still finds letters here and
  // there in common with the book; a short stretch of agreement between differences is a
  // coincidence, not the book, so count it as different too.
  for (let i = 0; i < chars.length;) {
    if (extra[i]) { i++; continue; }
    let j = i;
    while (j < chars.length && !extra[j]) j++;
    const before = i === 0 ? false : extra[i - 1] || gap[i], after = j === chars.length ? false : true;
    if (before && after && j - i < CFG_VERBATIM.minRun) for (let q = i; q < j; q++) { extra[q] = 1; gap[q] = 0; }
    i = j;
  }
  const marks = nodes.map((n, g) => n.nodeType === 1 && n.classList.contains("completion") ? { extra: new Uint8Array(strs[g].length), gap: new Uint8Array(strs[g].length + 1) } : null);
  for (let i = 0; i < chars.length; i++) {
    const [g, o] = where[i], m = marks[g];
    if (!m) continue;
    if (extra[i]) m.extra[o] = 1;
    // a removed character next to an extra one is a changed character: the yellow already shows it
    if (gap[i] && !extra[i] && !(i > 0 && extra[i - 1])) m.gap[o] = 1;
  }
  nodes.forEach((n, g) => { if (marks[g]) renderMarked(n, strs[g], marks[g]); });
  if (abort) text.scrollTop = text.scrollHeight;
}
function renderMarked(span, str, m) {
  span.textContent = "";
  let run = "", runMarked = false;
  const flush = () => {
    if (!run) return;
    if (runMarked) { const e = document.createElement("mark"); e.className = "diff"; e.textContent = run; span.appendChild(e); }
    else span.appendChild(document.createTextNode(run));
    run = "";
  };
  for (let o = 0; o < str.length; o++) {
    if (m.gap[o]) { flush(); const e = document.createElement("span"); e.className = "gap"; span.appendChild(e); }
    const mk = !!m.extra[o];
    if (mk !== runMarked) { flush(); runMarked = mk; }
    run += str[o];
  }
  flush();
}
// typing in the box turns the check off (and removes the highlighting, keeping the cursor where it was)
text.addEventListener("input", () => {
  if (!verbatim) return;
  verbatim = null;
  const sel = getSelection();
  let caret = null;
  if (sel.rangeCount && text.contains(sel.anchorNode)) {
    const r = document.createRange(); r.selectNodeContents(text); r.setEnd(sel.anchorNode, sel.anchorOffset);
    caret = r.toString().length;
  }
  for (const span of text.querySelectorAll(".completion")) span.textContent = span.textContent;
  if (caret != null) {
    const w = document.createTreeWalker(text, NodeFilter.SHOW_TEXT);
    let n, left = caret;
    while ((n = w.nextNode())) {
      if (left <= n.nodeValue.length) { const r = document.createRange(); r.setStart(n, left); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); break; }
      left -= n.nodeValue.length;
    }
  }
});

// stream a completion of the whole text box from an OpenAI-compatible /v1/completions endpoint
async function complete() {
  if (abort) { stop(); return; }
  err.textContent = "";
  const prompt = text.textContent;
  const span = document.createElement("span");
  span.className = "completion";
  span._text = "";   // the completion's text (the span may also hold highlighting)
  text.appendChild(span);
  abort = new AbortController();
  go.textContent = "stop";
  go.classList.add("on");
  // the temperature field and the max-tokens setting are all there is: with no max tokens,
  // the model keeps going until "stop" is pressed
  // top_p = 1 turns off "nucleus" truncation, so temperature alone decides how random it is
  const body = { prompt, temperature: +cfg.temperature, top_p: 1, stream: true };
  // llama.cpp also trims unlikely words before applying temperature (top_k 40, min_p 0.05 by
  // default), which mutes high temperatures; turn that off too (other servers don't know these)
  if (!cfg.model) { body.top_k = 0; body.min_p = 0; }
  if (+cfg.maxTokens > 0) body.max_tokens = +cfg.maxTokens;
  // a base model ends a "document" with an end-of-text token; llama.cpp can be told to
  // ignore it, so that with no limit the text really goes on until "stop" is pressed
  else if (!cfg.model) body.ignore_eos = true;
  if (cfg.model) body.model = cfg.model;
  const headers = { "Content-Type": "application/json" };
  if (cfg.key) headers.Authorization = "Bearer " + cfg.key;
  try {
    const res = await fetch(cfg.endpoint.replace(/\/$/, "") + "/v1/completions", { method: "POST", headers, body: JSON.stringify(body), signal: abort.signal });
    if (!res.ok) throw new Error(res.status + " " + (await res.text()).slice(0, 120));
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, k).trim();
        buf = buf.slice(k + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        const j = JSON.parse(data);
        const t = j.choices && j.choices[0] ? (j.choices[0].text || "") : (j.content || "");
        span._text += t;
        if (verbatim) scheduleCheck();
        else span.textContent = span._text;
        text.scrollTop = text.scrollHeight;
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") err.textContent = "can't reach the model (" + e.message + ")";
  } finally {
    abort = null;
    go.textContent = "complete";
    go.classList.remove("on");
    if (!span._text) span.remove();
    else if (verbatim) check();
    placeCaret();
  }
}

// settings: where the base model lives
gear.addEventListener("click", () => {
  const pop = Stage.popup({ x: 450, y: 220, w: 700, h: 360 });
  const box = Stage.el("div", { class: "settings" }, pop.box);
  Object.assign(box.style, { padding: "30px 40px" });
  const fields = [["endpoint", "endpoint (OpenAI-compatible, without /v1)"], ["model", "model (blank for llama.cpp)"],
    ["key", "API key (stored only in this browser)"]];
  const inputs = {};
  for (const [k, lab] of fields) {
    Stage.el("label", { text: lab }, box);
    inputs[k] = Stage.el("input", { type: k === "key" ? "password" : "text", value: cfg[k] }, box);
  }
  const save = Stage.button("save", () => {
    for (const k of Object.keys(inputs)) cfg[k] = inputs[k].value.trim();
    localStorage.setItem("demo5-settings", JSON.stringify(cfg));
    pop.close();
  }, box, { cls: "primary" });
  save.style.marginTop = "24px";
});

text.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); complete(); }
  if (e.key === "Escape") stop();
});

text.focus();
Stage.nav("../demo4-attention/2-translation.html", null);
window.demo = { complete, setText, cfg, setVerbatim, check, prefixDiff, normalize, get verbatim() { return verbatim; } };
</script>
</body>
</html>

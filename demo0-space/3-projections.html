<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Transformations: map projections and beyond</title>
<link rel="stylesheet" href="../common/stage.css">
</head>
<body>
<div id="stage"></div>
<script src="../common/stage.js"></script>
<script src="../common/optim.js"></script>
<script src="world.js"></script>
<script src="argo.js"></script>
<script src="map-common.js"></script>
<script>
"use strict";
// A transformation is a smooth function from space to space. Every map projection is one, from
// the globe to the page: each button smoothly moves every point of the current map to where the
// chosen projection puts it. "drift" keeps transforming the map at random; with "folds", the
// transformation also folds the space, so that different places land on top of each other.
const C = Stage.COLORS;
// tau: how long the random walk takes to wander; smooth: the time constant of the two low-pass
// filters it goes through before it moves the map (without them, the motion looks jittery)
const CFG = { morph: 1.6, modes: 8, tau: 4, smooth: 1.5, gentle: 0.08, wild: 0.12, eps: 0.04 };
const u = Optim.rng();
const MAIN = { x: 20, y: 70, w: 1560, h: 725 };
const panel = new Stage.Panel(MAIN);
const FIT = { x: 20, y: 20, w: MAIN.w - 40, h: MAIN.h - 40 };

// ---------------------------------------------------------------- geometry, as one array of lon/lat
const parts = [];   // {kind, start, n} (start and n count points, not numbers)
const ll = [];
function add(kind, pts) { parts.push({ kind, start: ll.length / 2, n: pts.length / 2 }); for (const v of pts) ll.push(v); }
for (let lon = -180; lon <= 180; lon += 30) { const p = []; for (let lat = -90; lat <= 90; lat += 2) p.push(lon, lat); add("grid", p); }
for (let lat = -90; lat <= 90; lat += 30) { const p = []; for (let lon = -180; lon <= 180; lon += 2) p.push(lon, lat); add("grid", p); }
for (const p of window.WORLD) add("land", p);
// identical small circles on the globe (6 degrees of arc in radius): how each map distorts sizes and shapes
for (let lat = -60; lat <= 60; lat += 30) for (let lon = -165; lon < 180; lon += 30) {
  const p = [], d = 6 * Math.PI / 180, f1 = lat * Math.PI / 180, l1 = lon * Math.PI / 180;
  for (let k = 0; k <= 48; k++) {
    const th = 2 * Math.PI * k / 48;
    const f2 = Math.asin(Math.sin(f1) * Math.cos(d) + Math.cos(f1) * Math.sin(d) * Math.cos(th));
    const l2 = l1 + Math.atan2(Math.sin(th) * Math.sin(d) * Math.cos(f1), Math.cos(d) - Math.sin(f1) * Math.sin(f2));
    p.push(l2 * 180 / Math.PI, f2 * 180 / Math.PI);
  }
  add("circle", p);
}
const floatStart = ll.length / 2;
add("floats", Array.from(MapC.floatsLonLat()));
const LONLAT = new Float32Array(ll);
const N = LONLAT.length;
const temps = MapC.temps();

// every projection's positions, in panel pixels
const NAMES = ["latlon", "mercator", "equalArea", "equidistant", "globe"];
const LABELS = { latlon: "latitude & longitude", mercator: "Mercator", equalArea: "equal area", equidistant: "equidistant", globe: "globe" };
const CAPTIONS = {
  latlon: "keeps north–south distances",
  mercator: "keeps shapes (angles), not areas",
  equalArea: "keeps areas, not shapes",
  equidistant: "keeps distances from the North Pole",
  globe: "the globe seen from far away: the far side folds onto the near side",
};
const TARGET = {};
for (const n of NAMES) TARGET[n] = MapC.project(n, LONLAT, FIT);

let cur = new Float32Array(TARGET.latlon);   // what's drawn
let from = null, to = null, t0 = 0, current = "latlon";
let drifting = false, base = null, modes = null, fold = null, caption = CAPTIONS.latlon;

// ---------------------------------------------------------------- random drift
// a sum of moving waves whose strengths wander at random (each starts at zero, so the map
// starts moving smoothly), plus, with "folds", a fold along a wandering line. Each random walk
// is smoothed by two low-pass filters in a row before it is used, so the map moves calmly.
const CX = FIT.x + FIT.w / 2, CY = FIT.y + FIT.h / 2, S = 360;
// a random walk (Ornstein-Uhlenbeck: it wanders but is pulled back toward zero), and its smoothed value
function walker(start, sigma) { return { raw: start, s1: start, value: start, sigma }; }
function walk(w, dt, sigma) {
  const tau = CFG.tau, k = 1 - Math.exp(-dt / CFG.smooth);
  w.raw += -w.raw / tau * dt + (sigma == null ? w.sigma : sigma) * Math.sqrt(2 * dt / tau) * u.normal();
  w.s1 += (w.raw - w.s1) * k;
  w.value += (w.s1 - w.value) * k;
}
function newModes() {
  modes = [];
  for (let k = 0; k < CFG.modes; k++) {
    const a = 2 * Math.PI * u(), m = 0.6 + 1.4 * u(), b = 2 * Math.PI * u();
    modes.push({ kx: m * Math.cos(a), ky: m * Math.sin(a), dx: Math.cos(b), dy: Math.sin(b), ph: 2 * Math.PI * u(), w: 0.3 * (u() - 0.5), amp: walker(0) });
  }
  const cx = 0.3 * u.normal(), cy = 0.3 * u.normal();
  fold = { cx: walker(cx, 0.3), cy: walker(cy, 0.3), ang: Math.PI * u(), spin: 0.25 * (u() < 0.5 ? -1 : 1), ramp: 0, f: 0 };
}
function stepDrift(dt) {
  const sigma = folds.checked ? CFG.wild : CFG.gentle;
  for (const m of modes) {
    walk(m.amp, dt, sigma);
    m.ph += m.w * dt;
  }
  fold.ang += fold.spin * dt * 0.3;
  walk(fold.cx, dt);
  walk(fold.cy, dt);
  // the fold comes in (or goes away) gradually, over 2 s
  fold.ramp = Math.max(0, Math.min(1, fold.ramp + (folds.checked ? 0.5 : -0.5) * dt));
  fold.f = fold.ramp * fold.ramp * (3 - 2 * fold.ramp);
}
function warp(src, out) {
  const nx = Math.cos(fold.ang), ny = Math.sin(fold.ang);
  for (let i = 0; i < src.length; i += 2) {
    let x = (src[i] - CX) / S, y = (src[i + 1] - CY) / S;
    let ox = x, oy = y;
    for (const m of modes) {
      const s = m.amp.value * Math.sin(m.kx * x + m.ky * y + m.ph);
      ox += s * m.dx; oy += s * m.dy;
    }
    if (fold.f > 0) {
      // the side of the line with d < 0 is folded over onto the side with d > 0
      const d = nx * (ox - fold.cx.value) + ny * (oy - fold.cy.value);
      const d2 = (1 - fold.f) * d + fold.f * Math.sqrt(d * d + CFG.eps * CFG.eps);
      ox += (d2 - d) * nx; oy += (d2 - d) * ny;
    }
    out[i] = CX + S * ox; out[i + 1] = CY + S * oy;
  }
  // keep the whole map in view: shrink (never enlarge) and recenter it into the panel, gently
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < out.length; i += 2) {
    if (out[i] < x0) x0 = out[i]; if (out[i] > x1) x1 = out[i];
    if (out[i + 1] < y0) y0 = out[i + 1]; if (out[i + 1] > y1) y1 = out[i + 1];
  }
  const target = { k: Math.min(1, FIT.w / (x1 - x0), FIT.h / (y1 - y0)), mx: (x0 + x1) / 2, my: (y0 + y1) / 2 };
  if (!view) view = target;
  else for (const key of ["k", "mx", "my"]) view[key] += (target[key] - view[key]) * (1 - Math.exp(-lastDt / 0.8));
  for (let i = 0; i < out.length; i += 2) {
    out[i] = CX + view.k * (out[i] - view.mx);
    out[i + 1] = CY + view.k * (out[i + 1] - view.my);
  }
}
let view = null, lastDt = 1 / 60;

// ---------------------------------------------------------------- drawing
function pathOf(c, p, close) {
  const a = cur, s = 2 * p.start;
  c.moveTo(a[s], a[s + 1]);
  for (let k = 1; k < p.n; k++) c.lineTo(a[s + 2 * k], a[s + 2 * k + 1]);
  if (close) c.closePath();
}
function draw() {
  const c = panel.clear();
  c.lineJoin = "round";
  if (grid.checked) {
    c.beginPath();
    for (const p of parts) if (p.kind === "grid") pathOf(c, p, false);
    c.strokeStyle = "rgba(0, 0, 0, 0.22)"; c.lineWidth = 1.2; c.stroke();
  }
  // land, translucent, one polygon at a time: where the map is folded, land shows darker
  c.fillStyle = "rgba(110, 110, 110, 0.32)";
  for (const p of parts) if (p.kind === "land") { c.beginPath(); pathOf(c, p, true); c.fill(); }
  c.beginPath();
  for (const p of parts) if (p.kind === "land") pathOf(c, p, true);
  c.strokeStyle = "rgba(60, 60, 60, 0.75)"; c.lineWidth = 1.2; c.stroke();
  if (circles.checked) {
    for (const p of parts) if (p.kind === "circle") { c.beginPath(); pathOf(c, p, true); c.fillStyle = C.accentFill; c.fill(); c.strokeStyle = C.accent; c.lineWidth = 1.5; c.stroke(); }
  }
  if (floats.checked) MapC.drawFloats(c, cur.subarray(2 * floatStart), temps);
  c.font = `22px ${C.font}`; c.fillStyle = C.grey; c.textAlign = "left"; c.textBaseline = "top";
  c.fillText(caption, 12, 10);
  c.strokeStyle = "#bbb"; c.lineWidth = 1.5; c.strokeRect(0.75, 0.75, MAIN.w - 1.5, MAIN.h - 1.5);
}

// ---------------------------------------------------------------- controls
function setActive(name) { for (const [n, b] of Object.entries(projButtons)) b.classList.toggle("on", n === name); }
function goTo(name) {
  stopDrift();
  from = new Float32Array(cur); to = TARGET[name]; t0 = performance.now();
  current = name; caption = CAPTIONS[name];
  setActive(name);
}
function stopDrift() {
  drifting = false;
  driftButton.textContent = "drift"; driftButton.classList.remove("on");
}
function startDrift() {
  if (drifting) { stopDrift(); return; }
  from = to = null;
  base = new Float32Array(cur);
  newModes();
  view = null;
  drifting = true; current = null; setActive(null);
  caption = folds.checked ? "a random smooth transformation that folds" : "a random smooth transformation";
  driftButton.textContent = "stop"; driftButton.classList.add("on");
}

const bar = Stage.controls({ x: 20, y: 812, w: 1560, h: 70 });
const projButtons = {};
for (const n of NAMES) projButtons[n] = Stage.button(LABELS[n], () => goTo(n), bar);
const driftButton = Stage.button("drift", startDrift, bar, { cls: "primary" });
function checkbox(text, on, onchange) {
  const l = Stage.el("label", { class: "field" }, bar);
  const box = Stage.el("input", { type: "checkbox" }, l);
  box.checked = on;
  l.appendChild(document.createTextNode(text));
  box.addEventListener("change", () => { box.blur(); if (onchange) onchange(); draw(); });
  return box;
}
const folds = checkbox("folds", false, () => {
  if (drifting) caption = folds.checked ? "a random smooth transformation that folds" : "a random smooth transformation";
});
const grid = checkbox("grid", true);
const circles = checkbox("circles", false);
const floats = checkbox("floats", false);
setActive("latlon");
panel.onresize = draw;
document.addEventListener("keydown", (e) => { if (e.key === " " && !e.repeat) { e.preventDefault(); startDrift(); } });

Stage.loop((dt, now) => {
  if (to) {
    const s = Math.min(1, (now - t0) / 1000 / CFG.morph), e = s * s * (3 - 2 * s);
    for (let i = 0; i < N; i++) cur[i] = from[i] + (to[i] - from[i]) * e;
    if (s >= 1) { cur.set(to); from = to = null; }
  } else if (drifting) {
    lastDt = dt;
    stepDrift(dt);
    warp(base, cur);
  }
  draw();
});

Stage.cite([
  ["J. P. Snyder, <i>Map Projections: A Working Manual</i>, USGS Professional Paper 1395 (1987).", "https://doi.org/10.3133/pp1395"],
  ["Land: Natural Earth.", "https://www.naturalearthdata.com"],
], { x: 510, y: 16, w: 1000 });
Stage.nav("2-ocean-model.html", "../demo3-generalization/4-snowflake.html");
window.demo = { CFG, goTo, startDrift, stopDrift, TARGET, get cur() { return cur; }, get current() { return current; }, get moving() { return !!to; } };
</script>
</body>
</html>

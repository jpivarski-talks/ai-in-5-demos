<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>A minimal network: a transformation, then a model</title>
<link rel="stylesheet" href="../common/stage.css">
</head>
<body>
<div id="stage"></div>
<script src="../common/tf.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/plots.js"></script>
<script src="../common/optim.js"></script>
<script src="nn-common.js"></script>
<script src="nn-diagram.js"></script>
<script src="view3d.js"></script>
<script>
"use strict";
// A 2 -> 3 -> 1 network: the hidden layer transforms the plane into 3D (drag the right panel to
// rotate it), where a flat plane separates the classes. (The version of the original talk,
// with the loss plot, is 2-circle-v1.html.)
const CFG = { n: 200, lr: 0.03, perFrame: 4, scale: 1.0, noise: 0.15, G: 100, g: 36 };
const u = Optim.rng();
const C = Stage.COLORS;
const D = NNDiagram, BOX = D.BOX;
// the two views, side by side and centered; below them, the buttons and the network
const S = 620, GAP = 80, X0 = (Stage.W - 2 * S - GAP) / 2, Y0 = 56;
const panel = new Stage.Panel({ x: 0, y: 0, w: Stage.W, h: Stage.H });
const FIT = { x: X0, y: Y0, w: S, h: S };
const ax = new Plots.Axes(panel, FIT, [-1.1, 1.1], [-1.1, 1.1]);
const view3d = new View3D({ x: X0 + S + GAP, y: Y0, w: S, h: S }, { lo: -1, hi: 1, labels: ["h1", "h2", "h3"], toward: [1, 0.75, 1.25] });
const NET = { x: X0 + 250, y: Y0 + S + 12, w: 2 * S + GAP - 250, h: Stage.H - (Y0 + S + 12) - 8 };

// network diagram geometry, in its own coordinates (scaled into NET when drawn)
const MID = 140;
const IN_X = 150, HID_X = 540, OUT_X0 = 920, OUT_X1 = 1030;
const NETBOX = { x: 105, y: MID - 135, w: 940, h: 262 };
const outY = D.stack(2, MID, 90);
const inY = D.stack(2, MID, BOX + 30).map((y) => y - BOX / 2);
const hidY = D.stack(3, MID, BOX + 6).map((y) => y - BOX / 2);

const gridBig = NN.grid(CFG.G, -1.1, 1.1), gridSmall = NN.grid(CFG.g, -1.1, 1.1);
const xin = D.inputGrid(CFG.g);
let data, X = null, Y = null, model = null, opt = null, running = false, view = null;

function newData() {
  data = NN.circle(CFG.n, u);
  if (X) { X.dispose(); Y.dispose(); }
  X = tf.tensor(data.xs);
  Y = tf.oneHot(tf.tensor1d(data.ys, "int32"), 2);
}
// The hidden layer starts out close to the identity: three directions 120 degrees apart,
// small enough that tanh is nearly linear, so the plane sits flat inside the cube.
function newModel() {
  if (model) model.dispose();
  const W1 = new Float32Array(6);
  for (let k = 0; k < 3; k++) {
    const a = Math.PI / 2 + 2 * Math.PI * k / 3;
    W1[k] = CFG.scale * Math.cos(a) + CFG.noise * u.normal();
    W1[3 + k] = CFG.scale * Math.sin(a) + CFG.noise * u.normal();
  }
  model = new NN.MLP([
    { W: tf.tensor(W1, [2, 3]), b: NN.randn([3], 0.05, u), act: "tanh" },
    { W: NN.randn([3, 2], 0.5, u), b: tf.zeros([2]) },   // one output per class
  ]);
  if (opt) opt.dispose();
  opt = tf.train.adam(CFG.lr);
  computeView();
}
const lossFn = () => tf.losses.softmaxCrossEntropy(Y, model.forward(X));
function loss() { return tf.tidy(() => lossFn().dataSync()[0]); }

function computeView() {
  view = tf.tidy(() => ({
    big: tf.softmax(model.forward(gridBig)).slice([0, 1], [-1, 1]).dataSync(),   // P(blue)
    small: model.forwardAll(gridSmall)[1].dataSync(),
    hidden: model.forwardAll(X)[1].arraySync(),
    w: model.weights(),
  }));
  view3d.set(view.hidden, data.ys);
}

// the network: x, y -> h1, h2, h3 -> output classes
function drawNetwork(c) {
  const W1 = view.w[0].W, W2 = view.w[1].W, m1 = D.maxAbs(W1), m2 = D.maxAbs(W2);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) {
    D.edge(c, IN_X + BOX, inY[i] + BOX / 2, HID_X, hidY[j] + BOX / 2, W1[i][j], m1);
  }
  // every hidden node feeds both outputs: orange (class 0) and blue (class 1)
  for (let j = 0; j < 3; j++) for (let o = 0; o < 2; o++) {
    D.edge(c, HID_X + BOX, hidY[j] + BOX / 2, OUT_X0, outY[o], W2[j][o], m2);
  }
  for (let o = 0; o < 2; o++) D.arrow(c, OUT_X0, outY[o], OUT_X1, outY[o], NN.classColor(o));
  ["x", "y"].forEach((lab, i) => D.featureBox(c, IN_X, inY[i], xin, CFG.g, 2, i, lab, "left"));
  ["h1", "h2", "h3"].forEach((lab, j) => D.featureBox(c, HID_X, hidY[j], view.small, CFG.g, 3, j, lab));
  D.tag(c, ["transform", "2D → 3D"], (IN_X + BOX + HID_X) / 2, MID);
}
function drawScaledNetwork(c) {
  const k = Math.min(NET.w / NETBOX.w, NET.h / NETBOX.h);
  c.save();
  c.translate(NET.x + (NET.w - NETBOX.w * k) / 2, NET.y + (NET.h - NETBOX.h * k) / 2);
  c.scale(k, k);
  c.translate(-NETBOX.x, -NETBOX.y);
  drawNetwork(c);
  c.restore();
}

function draw() {
  const c = panel.clear();
  if (!view) return;
  NN.paintRegions(c, FIT, view.big, CFG.G, 1);
  NN.drawPoints(ax, data.xs, data.ys, { r: 5.5, lw: 1.2 });
  D.cornerAxes(c, FIT, "x", "y");
  c.strokeStyle = "#bbb"; c.lineWidth = 1.5; c.strokeRect(FIT.x + 0.75, FIT.y + 0.75, S - 1.5, S - 1.5);
  drawScaledNetwork(c);
  view3d.draw();
}

function stop() { running = false; trainButton.textContent = "optimize model"; trainButton.classList.remove("on"); }
function train() {
  if (running) { stop(); return; }
  running = true;
  trainButton.textContent = "stop";
  trainButton.classList.add("on");
}

// the buttons, stacked, to the left of the network
const bar = Stage.controls({ x: X0, y: NET.y + 14, w: 230, h: NET.h - 28 });
Object.assign(bar.style, { flexDirection: "column", alignItems: "stretch", justifyContent: "center" });
Stage.button("new data", () => { stop(); newData(); newModel(); }, bar);
Stage.button("random model", () => { stop(); newModel(); }, bar);
const trainButton = Stage.button("optimize model", train, bar, { cls: "primary" });

newData();
newModel();
Stage.loop(() => {
  if (running) {
    for (let k = 0; k < CFG.perFrame; k++) opt.minimize(lossFn);
    computeView();
  }
  draw();
});

Stage.cite([["Adapted from C. Olah, <i>Neural Networks, Manifolds, and Topology</i> (2014).", "https://colah.github.io/posts/2014-03-NN-Manifolds-Topology/"]],
  { x: 310, y: 16, w: 1200 });
Stage.nav("4-snowflake.html", "3-spirals.html");
window.demo = { CFG, get model() { return model; }, train, stop, newModel, newData, loss, view3d };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Spirals: a transformation of the plane, then a linear model</title>
<link rel="stylesheet" href="../common/stage.css">
</head>
<body>
<div id="stage"></div>
<script src="../common/tf.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/plots.js"></script>
<script src="../common/optim.js"></script>
<script src="nn-common.js"></script>
<script src="nn-diagram.js"></script>
<script>
"use strict";
// The network 2 -> 100 -> 2 -> 3: the first two layers transform the plane (x, y) into a new plane
// (u, v), drawn on the right with the input grid's lines carried along, where straight lines
// separate the three spirals. (The version of the original talk, with the loss plot, is
// 3-spirals-v1.html.)
const CFG = { nPer: 300, H: 100, lr: 0.004, l2: 1e-5, perFrame: 2, noise: 0.05, G: 128, g: 36, lines: 21 };
const u = Optim.rng();
const C = Stage.COLORS;
const D = NNDiagram, BOX = D.BOX;
// the two views, side by side and centered; below them, the buttons and the network
const S = 620, GAP = 80, X0 = (Stage.W - 2 * S - GAP) / 2, Y0 = 56;
const panel = new Stage.Panel({ x: 0, y: 0, w: Stage.W, h: Stage.H });
const left = { x: X0, y: Y0, w: S, h: S }, right = { x: X0 + S + GAP, y: Y0, w: S, h: S };
const axL = new Plots.Axes(panel, left, [-1.1, 1.1], [-1.1, 1.1]);
const axR = new Plots.Axes(panel, right, [-1.1, 1.1], [-1.1, 1.1]);
// the network is between the buttons (on the left) and a note (on the right, NOTE_W wide)
const NOTE_W = 300;
const NET = { x: X0 + 250, y: Y0 + S + 12, w: 2 * S + GAP - 250 - NOTE_W - 20, h: Stage.H - (Y0 + S + 12) - 8 };

// the first data set is always the same; "new data" draws new spirals
let data = NN.spirals(CFG.nPer, Optim.rng(12345));
const N = data.xs.length;
let X = tf.tensor(data.xs), Yoh = tf.oneHot(tf.tensor1d(data.ys, "int32"), 3);
function newData() {
  data = NN.spirals(CFG.nPer, u);
  X.dispose(); Yoh.dispose();
  X = tf.tensor(data.xs); Yoh = tf.oneHot(tf.tensor1d(data.ys, "int32"), 3);
}
const gridT = NN.grid(CFG.G, -1.1, 1.1), gridSmall = NN.grid(CFG.g, -1.1, 1.1);
const xin = D.inputGrid(CFG.g);
// input-space grid lines, sampled densely so they can bend
const lineVals = Array.from({ length: CFG.lines }, (_, k) => -1.1 + 2.2 * k / (CFG.lines - 1));
const linePts = [];
for (const v of lineVals) for (let k = 0; k <= 80; k++) { const t = -1.1 + 2.2 * k / 80; linePts.push([v, t]); }
for (const v of lineVals) for (let k = 0; k <= 80; k++) { const t = -1.1 + 2.2 * k / 80; linePts.push([t, v]); }
const lineT = tf.tensor(linePts);

let model = null, opt = null, running = false, view = null, box = null, frameCount = 0;

// first two layers start out (almost) as the identity map: pairs of ReLUs facing
// opposite directions, ReLU(u.x) u - ReLU(-u.x) (-u) = (u.x) u, summed over directions
function newModel() {
  if (model) model.dispose();
  const H = CFG.H, K = H / 2;
  const W1 = new Float32Array(2 * H), W2 = new Float32Array(H * 2), b1 = new Float32Array(H);
  for (let k = 0; k < K; k++) {
    const a = Math.PI * 2 * k / K + 0.3 * u.normal() / K, c = Math.cos(a), s = Math.sin(a);
    for (const [j, sign] of [[2 * k, 1], [2 * k + 1, -1]]) {
      W1[0 * H + j] = sign * c + CFG.noise * u.normal();
      W1[1 * H + j] = sign * s + CFG.noise * u.normal();
      W2[j * 2 + 0] = sign * c * 2 / K + CFG.noise * u.normal() / K;
      W2[j * 2 + 1] = sign * s * 2 / K + CFG.noise * u.normal() / K;
      b1[j] = CFG.noise * u.normal();
    }
  }
  model = new NN.MLP([
    { W: tf.tensor(W1, [2, H]), b: tf.tensor(b1), act: "relu" },
    { W: tf.tensor(W2, [H, 2]), b: tf.zeros([2]) },
    { W: NN.randn([2, 3], 1.0, u), b: tf.zeros([3]) },
  ]);
  if (opt) opt.dispose();
  opt = tf.train.adam(CFG.lr);
  box = null;
  computeView();
}

function lossFn() {
  const logits = model.forward(X);
  let L = tf.losses.softmaxCrossEntropy(Yoh, logits);
  for (const l of model.layers) L = tf.add(L, tf.mul(0.5 * CFG.l2, tf.sum(tf.square(l.W))));
  return L;
}
function loss() { return tf.tidy(() => lossFn().dataSync()[0]); }

function computeView() {
  // the fine-grained input-space map is the slowest part, so refresh it every other frame
  const probs = !view || !running || (frameCount++ % 2 === 0) ? tf.tidy(() => tf.softmax(model.forward(gridT)).dataSync()) : view.probs;
  view = tf.tidy(() => ({
    probs,
    z: model.forwardAll(X)[2].dataSync(),
    lines: model.forwardAll(lineT)[2].dataSync(),
    acc: tf.mean(tf.cast(tf.equal(tf.argMax(model.forward(X), 1), tf.argMax(Yoh, 1)), "float32")).dataSync()[0],
    w3: model.layers[2].W.arraySync(), b3: model.layers[2].b.arraySync(),
    small: model.forwardAll(gridSmall)[2].dataSync(),
    w1: model.layers[0].W.arraySync(), w2: model.layers[1].W.arraySync(),
  }));
  // square view box around the transformed data, eased so it doesn't jump
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < N; i++) {
    x0 = Math.min(x0, view.z[2 * i]); x1 = Math.max(x1, view.z[2 * i]);
    y0 = Math.min(y0, view.z[2 * i + 1]); y1 = Math.max(y1, view.z[2 * i + 1]);
  }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, h = Math.max(x1 - x0, y1 - y0) * 0.6 + 1e-3;
  const target = [cx, cy, h];
  box = box ? box.map((v, k) => v + 0.15 * (target[k] - v)) : target;
  axR.xlim = [box[0] - box[2], box[0] + box[2]];
  axR.ylim = [box[1] - box[2], box[1] + box[2]];
}

function drawRight(c) {
  // regions of the final (linear) layer, drawn in the transformed coordinates
  const G = 100, probs = new Float32Array(G * G * 3), { w3, b3 } = view;
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const zx = axR.xlim[0] + (axR.xlim[1] - axR.xlim[0]) * (i + 0.5) / G;
    const zy = axR.ylim[1] - (axR.ylim[1] - axR.ylim[0]) * (j + 0.5) / G;
    const l = [0, 1, 2].map((k) => zx * w3[0][k] + zy * w3[1][k] + b3[k]);
    const m = Math.max(...l), e = l.map((v) => Math.exp(v - m)), s = e[0] + e[1] + e[2];
    for (let k = 0; k < 3; k++) probs[3 * (j * G + i) + k] = e[k] / s;
  }
  NN.paintRegions(c, right, probs, G, 3);
  axR.clip((c) => NN.drawContours(c, right, probs, G, 3));
  axR.clip((c) => {
    c.strokeStyle = "rgba(60, 60, 60, 0.4)";
    c.lineWidth = 1;
    const L = view.lines, per = 81;
    for (let l = 0; l < 2 * CFG.lines; l++) {
      c.beginPath();
      for (let k = 0; k < per; k++) {
        const p = l * per + k, x = axR.X(L[2 * p]), y = axR.Y(L[2 * p + 1]);
        if (k === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.stroke();
    }
    const zs = [];
    for (let i = 0; i < N; i++) zs.push([view.z[2 * i], view.z[2 * i + 1]]);
    NN.drawPoints(axR, zs, data.ys, { r: 4, lw: 0.8 });
  });
  D.cornerAxes(c, right, "u", "v");
  c.strokeStyle = "#bbb"; c.lineWidth = 1.5; c.strokeRect(right.x, right.y, right.w, right.h);
}

function drawLeft(c) {
  NN.paintRegions(c, left, view.probs, CFG.G, 3);
  axL.clip((c) => NN.drawContours(c, left, view.probs, CFG.G, 3));
  axL.clip((c) => {
    c.strokeStyle = "rgba(60, 60, 60, 0.18)";
    c.lineWidth = 1;
    for (const v of lineVals) {
      c.beginPath(); c.moveTo(axL.X(v), axL.Y(-1.1)); c.lineTo(axL.X(v), axL.Y(1.1)); c.stroke();
      c.beginPath(); c.moveTo(axL.X(-1.1), axL.Y(v)); c.lineTo(axL.X(1.1), axL.Y(v)); c.stroke();
    }
    NN.drawPoints(axL, data.xs, data.ys, { r: 4, lw: 0.8 });
  });
  D.cornerAxes(c, left, "x", "y");
  c.strokeStyle = "#bbb"; c.lineWidth = 1.5; c.strokeRect(left.x, left.y, left.w, left.h);
}

// the network, drawn like the previous page: x, y -> 100 ReLUs -> u, v -> three classes,
// in its own coordinates (scaled into NET when drawn)
const MID = 140;
const IN_X = 110, HID_X = 420, Z_X = 700, OUT_X0 = 980, OUT_X1 = 1080;
const NETBOX = { x: 70, y: MID - 125, w: 1020, h: 250 };
const inY = D.stack(2, MID, BOX + 30).map((y) => y - BOX / 2);
const zY = D.stack(2, MID, BOX + 30).map((y) => y - BOX / 2);
const hidY = D.stack(CFG.H, MID, 2.1);
const outY = D.stack(3, MID, 80);
function drawNetwork(c) {
  const { w1, w2, w3 } = view, m1 = D.maxAbs(w1), m2 = D.maxAbs(w2), m3 = D.maxAbs(w3);
  for (let i = 0; i < 2; i++) for (let j = 0; j < CFG.H; j++) D.edge(c, IN_X + BOX, inY[i] + BOX / 2, HID_X, hidY[j], w1[i][j], m1, 1);
  for (let j = 0; j < CFG.H; j++) for (let k = 0; k < 2; k++) D.edge(c, HID_X, hidY[j], Z_X, zY[k] + BOX / 2, w2[j][k], m2, 1);
  for (let k = 0; k < 2; k++) for (let o = 0; o < 3; o++) D.edge(c, Z_X + BOX, zY[k] + BOX / 2, OUT_X0, outY[o], w3[k][o], m3);
  c.fillStyle = "#777";
  for (const y of hidY) { c.beginPath(); c.arc(HID_X, y, 1.6, 0, 2 * Math.PI); c.fill(); }
  for (let o = 0; o < 3; o++) D.arrow(c, OUT_X0, outY[o], OUT_X1, outY[o], NN.classColor(o));
  ["x", "y"].forEach((lab, i) => D.featureBox(c, IN_X, inY[i], xin, CFG.g, 2, i, lab, "left"));
  ["u", "v"].forEach((lab, k) => D.featureBox(c, Z_X, zY[k], view.small, CFG.g, 2, k, lab));
  D.tag(c, ["transform", "(x, y) → (u, v)"], HID_X, MID);
}

function drawScaledNetwork(c) {
  const k = Math.min(NET.w / NETBOX.w, NET.h / NETBOX.h);
  c.save();
  c.translate(NET.x + (NET.w - NETBOX.w * k) / 2, NET.y + (NET.h - NETBOX.h * k) / 2);
  c.scale(k, k);
  c.translate(-NETBOX.x, -NETBOX.y);
  drawNetwork(c);
  c.restore();
}

function draw() {
  const c = panel.clear();
  if (!view) return;
  drawLeft(c);
  drawRight(c);
  drawScaledNetwork(c);
}

function stop() { running = false; trainButton.textContent = "optimize model"; trainButton.classList.remove("on"); }
function train() {
  if (running) { stop(); return; }
  running = true;
  trainButton.textContent = "stop";
  trainButton.classList.add("on");
}

// the buttons, stacked, to the left of the network
const bar = Stage.controls({ x: X0, y: NET.y + 14, w: 230, h: NET.h - 28 });
Object.assign(bar.style, { flexDirection: "column", alignItems: "stretch", justifyContent: "center" });
Stage.button("new data", () => { stop(); newData(); newModel(); }, bar);
Stage.button("random model", () => { stop(); newModel(); }, bar);
const trainButton = Stage.button("optimize model", train, bar, { cls: "primary" });
// the note, at the right edge of the right panel (its lines centered) and vertically centered with the buttons,
// in the slides' body text style
Stage.label("Fits both the space\ntransformation and\nthe data at once.",
  { x: X0 + 2 * S + GAP - NOTE_W, y: NET.y, w: NOTE_W, h: NET.h },
  { fontSize: "34px", lineHeight: "1.2", color: C.ink, display: "flex", alignItems: "center", justifyContent: "flex-end",
    textAlign: "center", whiteSpace: "pre-line", pointerEvents: "none" });

newModel();
Stage.loop(() => {
  if (running) {
    for (let k = 0; k < CFG.perFrame; k++) opt.minimize(lossFn);
    computeView();
  }
  draw();
});

Stage.cite([["Adapted from A. Canziani, Y. LeCun, <i>NYU Deep Learning</i> (2020).", "https://github.com/Atcold/NYU-DLSP20"]],
  { x: 310, y: 16, w: 1200 });
Stage.nav("2-circle.html", "../demo4-attention/1-embedding.html");
window.demo = { draw, CFG, get model() { return model; }, train, stop, newModel, newData, loss, get acc() { return view.acc; } };
</script>
</body>
</html>

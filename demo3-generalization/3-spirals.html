<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo 3.3: spirals</title>
<link rel="stylesheet" href="../common/stage.css">
</head>
<body>
<div id="stage"></div>
<script src="../lib/tf.min.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/plots.js"></script>
<script src="../common/optim.js"></script>
<script src="nn-common.js"></script>
<script>
"use strict";
const CFG = { nPer: 300, H: 100, lr: 0.004, l2: 1e-5, perFrame: 2, noise: 0.05, G: 90, lines: 21 };
const u = Optim.rng();
const C = Stage.COLORS;
const P = 520;
const panel = new Stage.Panel(Stage.L.main);
const left = { x: 0, y: 0, w: P, h: P }, right = { x: 1060 - P, y: 0, w: P, h: P };
const axL = new Plots.Axes(panel, left, [-1.1, 1.1], [-1.1, 1.1]);
const axR = new Plots.Axes(panel, right, [-1.1, 1.1], [-1.1, 1.1]);
const readout = new Plots.Readout({ label: "loss" });
const history = new Plots.History({ mode: "line", xSpan: 300, yLabel: "loss", xLabel: "iteration" });

const data = NN.spirals(CFG.nPer, Optim.rng(12345));
const N = data.xs.length;
const X = tf.tensor(data.xs), Yoh = tf.oneHot(tf.tensor1d(data.ys, "int32"), 3);
const gridT = NN.grid(CFG.G, -1.1, 1.1);
// input-space grid lines, sampled densely so they can bend
const lineVals = Array.from({ length: CFG.lines }, (_, k) => -1.1 + 2.2 * k / (CFG.lines - 1));
const linePts = [];
for (const v of lineVals) for (let k = 0; k <= 80; k++) { const t = -1.1 + 2.2 * k / 80; linePts.push([v, t]); }
for (const v of lineVals) for (let k = 0; k <= 80; k++) { const t = -1.1 + 2.2 * k / 80; linePts.push([t, v]); }
const lineT = tf.tensor(linePts);

let model = null, opt = null, running = false, view = null, box = null;

// first two layers start out (almost) as the identity map: pairs of ReLUs facing
// opposite directions, ReLU(u.x) u - ReLU(-u.x) (-u) = (u.x) u, summed over directions
function newModel() {
  if (model) model.dispose();
  const H = CFG.H, K = H / 2;
  const W1 = new Float32Array(2 * H), W2 = new Float32Array(H * 2), b1 = new Float32Array(H);
  for (let k = 0; k < K; k++) {
    const a = Math.PI * 2 * k / K + 0.3 * u.normal() / K, c = Math.cos(a), s = Math.sin(a);
    for (const [j, sign] of [[2 * k, 1], [2 * k + 1, -1]]) {
      W1[0 * H + j] = sign * c + CFG.noise * u.normal();
      W1[1 * H + j] = sign * s + CFG.noise * u.normal();
      W2[j * 2 + 0] = sign * c * 2 / K + CFG.noise * u.normal() / K;
      W2[j * 2 + 1] = sign * s * 2 / K + CFG.noise * u.normal() / K;
      b1[j] = CFG.noise * u.normal();
    }
  }
  model = new NN.MLP([
    { W: tf.tensor(W1, [2, H]), b: tf.tensor(b1), act: "relu" },
    { W: tf.tensor(W2, [H, 2]), b: tf.zeros([2]) },
    { W: NN.randn([2, 3], 1.0, u), b: tf.zeros([3]) },
  ]);
  if (opt) opt.dispose();
  opt = tf.train.adam(CFG.lr);
  history.clear();
  box = null;
  computeView();
}

function lossFn() {
  const logits = model.forward(X);
  let L = tf.losses.softmaxCrossEntropy(Yoh, logits);
  for (const l of model.layers) L = tf.add(L, tf.mul(0.5 * CFG.l2, tf.sum(tf.square(l.W))));
  return L;
}
function loss() { return tf.tidy(() => lossFn().dataSync()[0]); }

function computeView() {
  view = tf.tidy(() => ({
    probs: tf.softmax(model.forward(gridT)).dataSync(),
    z: model.forwardAll(X)[2].dataSync(),
    lines: model.forwardAll(lineT)[2].dataSync(),
    acc: tf.mean(tf.cast(tf.equal(tf.argMax(model.forward(X), 1), tf.argMax(Yoh, 1)), "float32")).dataSync()[0],
    w3: model.layers[2].W.arraySync(), b3: model.layers[2].b.arraySync(),
  }));
  // square view box around the transformed data, eased so it doesn't jump
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < N; i++) {
    x0 = Math.min(x0, view.z[2 * i]); x1 = Math.max(x1, view.z[2 * i]);
    y0 = Math.min(y0, view.z[2 * i + 1]); y1 = Math.max(y1, view.z[2 * i + 1]);
  }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, h = Math.max(x1 - x0, y1 - y0) * 0.6 + 1e-3;
  const target = [cx, cy, h];
  box = box ? box.map((v, k) => v + 0.15 * (target[k] - v)) : target;
  axR.xlim = [box[0] - box[2], box[0] + box[2]];
  axR.ylim = [box[1] - box[2], box[1] + box[2]];
}

function drawRight(c) {
  // regions of the final (linear) layer, drawn in the transformed coordinates
  const G = 70, probs = new Float32Array(G * G * 3), { w3, b3 } = view;
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const zx = axR.xlim[0] + (axR.xlim[1] - axR.xlim[0]) * (i + 0.5) / G;
    const zy = axR.ylim[1] - (axR.ylim[1] - axR.ylim[0]) * (j + 0.5) / G;
    const l = [0, 1, 2].map((k) => zx * w3[0][k] + zy * w3[1][k] + b3[k]);
    const m = Math.max(...l), e = l.map((v) => Math.exp(v - m)), s = e[0] + e[1] + e[2];
    for (let k = 0; k < 3; k++) probs[3 * (j * G + i) + k] = e[k] / s;
  }
  NN.paintRegions(c, right, probs, G, 3);
  axR.clip((c) => {
    c.strokeStyle = "rgba(60, 60, 60, 0.4)";
    c.lineWidth = 1;
    const L = view.lines, per = 81;
    for (let l = 0; l < 2 * CFG.lines; l++) {
      c.beginPath();
      for (let k = 0; k < per; k++) {
        const p = l * per + k, x = axR.X(L[2 * p]), y = axR.Y(L[2 * p + 1]);
        if (k === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.stroke();
    }
    const zs = [];
    for (let i = 0; i < N; i++) zs.push([view.z[2 * i], view.z[2 * i + 1]]);
    NN.drawPoints(axR, zs, data.ys, { r: 3.5, lw: 0.8 });
  });
  c.strokeStyle = "#bbb"; c.lineWidth = 1.5; c.strokeRect(right.x, right.y, right.w, right.h);
}

function drawLeft(c) {
  NN.paintRegions(c, left, view.probs, CFG.G, 3);
  axL.clip((c) => {
    c.strokeStyle = "rgba(60, 60, 60, 0.18)";
    c.lineWidth = 1;
    for (const v of lineVals) {
      c.beginPath(); c.moveTo(axL.X(v), axL.Y(-1.1)); c.lineTo(axL.X(v), axL.Y(1.1)); c.stroke();
      c.beginPath(); c.moveTo(axL.X(-1.1), axL.Y(v)); c.lineTo(axL.X(1.1), axL.Y(v)); c.stroke();
    }
    NN.drawPoints(axL, data.xs, data.ys, { r: 3.5, lw: 0.8 });
  });
  c.strokeStyle = "#bbb"; c.lineWidth = 1.5; c.strokeRect(left.x, left.y, left.w, left.h);
}

// schematic of the network: 2 -> 100 -> 2 -> 3 (no live weights)
function drawSchematic(c) {
  const top = P + 40, bot = 770, mid = (top + bot) / 2;
  const cols = [
    { x: 150, n: 2, color: C.ink, panel: left },
    { x: 400, n: CFG.H, color: "#999" },
    { x: 660, n: 2, color: C.ink, panel: right },
    { x: 910, n: 3, color: null },
  ];
  const ys = (col) => {
    const n = col.n, span = n > 10 ? bot - top : Math.min(bot - top, (n - 1) * 70);
    return Array.from({ length: n }, (_, i) => (n === 1 ? mid : mid - span / 2 + span * i / (n - 1)));
  };
  c.strokeStyle = "rgba(120, 120, 120, 0.12)";
  c.lineWidth = 1;
  for (let k = 0; k < cols.length - 1; k++) {
    const a = cols[k], b = cols[k + 1], ya = ys(a), yb = ys(b);
    for (const y0 of ya) for (const y1 of yb) { c.beginPath(); c.moveTo(a.x, y0); c.lineTo(b.x, y1); c.stroke(); }
  }
  cols.forEach((col, k) => {
    ys(col).forEach((y, i) => {
      c.fillStyle = col.color || NN.classColor(i);
      c.beginPath(); c.arc(col.x, y, col.n > 10 ? 2 : 11, 0, 2 * Math.PI); c.fill();
    });
  });
  // brackets linking the 2-node layers to the panels above them
  c.strokeStyle = "#bbb";
  c.lineWidth = 1.5;
  c.setLineDash([5, 6]);
  for (const col of [cols[0], cols[2]]) {
    c.beginPath(); c.moveTo(col.x, top - 6); c.lineTo(col.panel.x + col.panel.w / 2, P + 4); c.stroke();
  }
  c.setLineDash([]);
}

function draw() {
  const c = panel.clear();
  if (!view) return;
  drawLeft(c);
  drawRight(c);
  drawSchematic(c);
}

function stop() { running = false; trainButton.textContent = "train"; trainButton.classList.remove("on"); }
function train() {
  if (running) { stop(); return; }
  if (history.length === 0) history.push(loss());
  running = true;
  trainButton.textContent = "stop";
  trainButton.classList.add("on");
}

const bar = Stage.controls({ x: 20, y: 815, w: 1060, h: 70 });
Stage.button("new start", () => { stop(); newModel(); readout.set(loss().toFixed(3)); }, bar);
const trainButton = Stage.button("train", train, bar, { cls: "primary" });

newModel();
readout.set(loss().toFixed(3));
Stage.loop(() => {
  if (running) {
    for (let k = 0; k < CFG.perFrame; k++) {
      opt.minimize(lossFn);
      history.push(loss());
    }
    computeView();
    readout.set(history.a[history.length - 1].toFixed(3));
    history.draw();
  }
  draw();
});

Stage.nav("2-circle.html", "../demo4-attention/1-embedding.html");
window.demo = { CFG, get model() { return model; }, history, train, newModel, loss, get acc() { return view.acc; } };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Demo 2.1: fitting with templates</title>
<link rel="stylesheet" href="../common/stage.css">
</head>
<body>
<div id="stage"></div>
<script src="../common/stage.js"></script>
<script src="../common/plots.js"></script>
<script src="../common/optim.js"></script>
<script src="fits1d.js"></script>
<script src="data1d.js"></script>
<script>
"use strict";
const K = 8;
const C = Stage.COLORS;
const panel = new Stage.Panel(Stage.L.main);
const ax = new Plots.Axes(panel, { x: 30, y: 10, w: 1020, h: 680 }, [-0.02, 1.02], [-3, 3]);
const readout = new Plots.Readout({ label: "loss" });
const history = new Plots.History({ mode: "line", xSpan: K, yLabel: "loss", xLabel: "templates" });
const u = Optim.rng();
const FX = Float64Array.from({ length: 400 }, (_, i) => i / 399);

let y, fit, included = 0, anim = null, shown = 0;

function newData() {
  y = Data1D.make(u);
  fit = Fits1D.cosineFit(y, K);
  let lo = Infinity, hi = -Infinity;
  for (const v of y) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const pad = (hi - lo) * 0.15;
  ax.ylim = [lo - pad, hi + pad];
  included = 0; shown = 0; anim = null;
  buttons.forEach((b, k) => { b.disabled = false; b.textContent = templateLabel(k); });
  history.clear();
  history.push(lossAt(0));
  history.draw();
  readout.set(lossAt(0).toFixed(3));
}
function lossAt(n) { return Fits1D.sse(y, Fits1D.cosineCurve(fit.mean, fit.amps, n)); }

// button text: the template's formula, A cos(k x), taking x from 0 to pi across the plot
function templateLabel(k) {
  const a = fit.amps[k];
  const A = Math.abs(a).toFixed(3);
  return (a < 0 ? "\u2212" : "") + A + " cos(" + (k === 0 ? "" : k + 1) + "x)";
}

// bring template k down from above, then fold it into the fit
function add(k) {
  if (anim || k !== included) return;
  buttons[k].disabled = true;
  anim = { k, t: 0 };
}

const DESCEND = 0.9, HOLD = 0.4;   // seconds to come down, then to pause in the middle
function draw() {
  const c = panel.clear();
  ax.frame({ xlabel: "x", ylabel: "y" });
  const mid = (ax.ylim[0] + ax.ylim[1]) / 2, span = ax.ylim[1] - ax.ylim[0];
  ax.clip(() => {
    ax.dots(Fits1D.xs, y, { r: 5, color: "#555" });
    ax.curve(FX, Fits1D.cosineCurve(fit.mean, fit.amps, shown, FX), { color: C.accent, width: 4 });
    if (anim) {
      const k = anim.k, a = fit.amps[k];
      const off = mid + span * (1 - Optim.smooth(Math.min(1, anim.t / DESCEND)));
      const tY = Array.from(FX, (x) => off + a * Math.cos((k + 1) * Math.PI * x));
      ax.curve(FX, tY, { color: C.orange, width: 4 });
    }
  });
}

// two rows of four buttons, since each one shows its formula
const bar = Stage.controls({ x: 20, y: 755, w: 1060, h: 130 });
Object.assign(bar.style, { flexDirection: "column", alignItems: "flex-start", gap: "10px" });
const rows = [0, 1].map(() => Stage.el("div", { style: { display: "flex", gap: "12px", alignItems: "center" } }, bar));
const buttons = [];
for (let k = 0; k < K; k++) {
  const b = Stage.button("", () => add(k), rows[k < 4 ? 0 : 1]);
  Object.assign(b.style, { fontSize: "21px", width: "205px", padding: "6px 4px", whiteSpace: "nowrap" });
  buttons.push(b);
}
const newButton = Stage.button("new data", newData, rows[1]);
newButton.style.marginLeft = "40px";
document.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); add(included); }
  if (e.key >= "1" && e.key <= "8") add(+e.key - 1);
});

Stage.loop((dt) => {
  if (anim) {
    anim.t += dt;
    // once the template lands in the middle, it pauses, then disappears and the fit snaps to include it
    if (anim.t >= DESCEND + HOLD) {
      included++;
      shown = included;
      anim = null;
      history.push(lossAt(included));
      history.draw();
      readout.set(lossAt(included).toFixed(3));
    }
  }
  draw();
});

newData();
Stage.nav("../demo1-optimization/3-optimize.html", "2-fourier-image.html");
window.demo = { add, newData, get fit() { return fit; }, get y() { return y; } };
</script>
</body>
</html>
